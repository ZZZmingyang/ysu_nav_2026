/smoother_server:
  ros__parameters:
    /bond_disable_heartbeat_timeout: true
    costmap_topic: global_costmap/costmap_raw
    footprint_topic: global_costmap/published_footprint
    robot_base_frame: base_link
    simple_smoother.do_refinement: true
    simple_smoother.max_its: 1000
    simple_smoother.plugin: nav2_smoother::SimpleSmoother
    simple_smoother.tolerance: 1.0e-10
    simple_smoother.w_data: 0.2
    simple_smoother.w_smooth: 0.3
    smoother_plugins:
    - simple_smoother
    transform_tolerance: 0.1
    use_sim_time: false
