    global_frame: odom
    height: 5
    inflation_layer.cost_scaling_factor: 4.0
    inflation_layer.enabled: true
    inflation_layer.inflate_around_unknown: false
    inflation_layer.inflate_unknown: false
    inflation_layer.inflation_radius: 0.7
    inflation_layer.plugin: nav2_costmap_2d::InflationLayer
    intensity_voxel_layer.combination_method: 1
    intensity_voxel_layer.enabled: true
    intensity_voxel_layer.footprint_clearing_enabled: true
    intensity_voxel_layer.mark_threshold: 0
    intensity_voxel_layer.max_obstacle_height: 2.0
    intensity_voxel_layer.max_obstacle_intensity: 2.0
    intensity_voxel_layer.min_obstacle_height: 0.0
    intensity_voxel_layer.min_obstacle_intensity: 0.1
    intensity_voxel_layer.observation_sources: terrain_map
    intensity_voxel_layer.origin_z: 0.0
    intensity_voxel_layer.plugin: pb_nav2_costmap_2d::IntensityVoxelLayer
    intensity_voxel_layer.publish_voxel_map: false
    intensity_voxel_layer.terrain_map.clearing: false
    intensity_voxel_layer.terrain_map.data_type: PointCloud2
    intensity_voxel_layer.terrain_map.expected_update_rate: 0.0
    intensity_voxel_layer.terrain_map.inf_is_valid: false
    intensity_voxel_layer.terrain_map.marking: true
    intensity_voxel_layer.terrain_map.max_obstacle_height: 2.0
    intensity_voxel_layer.terrain_map.min_obstacle_height: 0.0
    intensity_voxel_layer.terrain_map.observation_persistence: 0.0
    intensity_voxel_layer.terrain_map.obstacle_max_range: 5.0
    intensity_voxel_layer.terrain_map.obstacle_min_range: 0.2
    intensity_voxel_layer.terrain_map.raytrace_max_range: 3.0
    intensity_voxel_layer.terrain_map.raytrace_min_range: 0.0
    intensity_voxel_layer.terrain_map.sensor_frame: front_mid360
    intensity_voxel_layer.terrain_map.topic: /terrain_map
    intensity_voxel_layer.unknown_threshold: 5
    intensity_voxel_layer.z_resolution: 0.05
    intensity_voxel_layer.z_voxels: 16
    lethal_cost_threshold: 100
    map_topic: /map
    observation_sources: ''
    origin_x: 0.0
    origin_y: 0.0
