    resolution: 0.05
    robot_base_frame: gimbal_yaw_fake
    robot_radius: 0.2
    rolling_window: true
    static_layer.enabled: true
    static_layer.footprint_clearing_enabled: false
    static_layer.map_subscribe_transient_local: true
    static_layer.map_topic: ''
    static_layer.plugin: nav2_costmap_2d::StaticLayer
    static_layer.subscribe_to_updates: false
    static_layer.transform_tolerance: 0.0
    track_unknown_space: false
    transform_tolerance: 0.3
    trinary_costmap: true
    unknown_cost_value: 255
    update_frequency: 10.0
    use_maximum: false
    use_sim_time: false
    width: 5
