/planner_server:
  ros__parameters:
    /bond_disable_heartbeat_timeout: true
    GridBased.allow_unknown: true
    GridBased.how_many_corners: 8
    GridBased.plugin: nav2_theta_star_planner/ThetaStarPlanner
    GridBased.use_final_approach_orientation: false
    GridBased.w_euc_cost: 1.0
    GridBased.w_traversal_cost: 10.0
    expected_planner_frequency: 10.0
    planner_plugins:
    - GridBased
    use_sim_time: false
